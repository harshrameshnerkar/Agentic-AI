name: Day 15 Capstone - LLMOps Evaluation & Regression Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - 'day_15/**'
      - '.github/workflows/day15_capstone_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'day_15/**'

jobs:
  eval-regression-gate:
    name: Stratified Golden Evaluation & Safety Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r day_15/requirements.txt

      - name: Run Session 1 Unit & Integration Tests
        run: |
          python day_15/session_1/test_session_1.py

      - name: Run CI Golden Evaluation Suite (Blocks Build on Regression)
        run: |
          python day_15/session_1/eval_ci_runner.py

      - name: Verify Cryptographic Audit Integrity
        run: |
          python day_15/session_1/main.py --audit-check
